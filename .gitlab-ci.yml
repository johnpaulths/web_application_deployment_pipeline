variables:
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  LATEST_TAG: $CI_REGISTRY_IMAGE:latest

stages:
  - build
  - test
  - deploy-dev
  - deploy-staging
  - deploy-production

# Build Docker image
build:
  stage: build
  image: docker:25-cli
  tags:
    - docker
    - dev
  before_script:
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - docker build -t $IMAGE_TAG -t $LATEST_TAG .
    - echo "Pushing to registry..."
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG
    - echo "Build complete! Image tagged as $CI_COMMIT_SHORT_SHA"
  only:
    - main
    - develop

# Unit tests
test:
  stage: test
  image: python:3.11-slim
  tags:
    - docker
    - dev
  before_script:
    - cd app
    - pip install -r requirements.txt
  script:
    - echo "Running tests..."
    - python -c "import app; print('✅ Basic import test passed')"
    - python -c "from app import app; print('✅ Flask app import successful')"
  only:
    - main
    - develop

# Deploy to Development
deploy:dev:
  stage: deploy-dev
  image: alpine:latest
  tags:
    - docker
    - dev
  before_script:
    - apk add --no-cache docker-cli curl bash  # Add this line to install curl
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - echo "Deploying to Development environment..."
    - chmod +x scripts/deploy.sh
    - ./scripts/deploy.sh dev $CI_COMMIT_SHORT_SHA
    - sleep 10
    - chmod +x scripts/smoke-test.sh
    - ./scripts/smoke-test.sh dev 8080
  environment:
    name: development
    url: http://development-environment
  only:
    - develop
    - main

# Deploy to Staging
deploy:staging:
  stage: deploy-staging
  image: alpine:latest
  tags:
    - docker
    - staging
  before_script:
    - apk add --no-cache docker-cli curl bash
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - echo "Deploying to Staging environment..."
    - chmod +x scripts/deploy.sh
    - ./scripts/deploy.sh staging $CI_COMMIT_SHORT_SHA
    - sleep 10
    - chmod +x scripts/smoke-test.sh
    - ./scripts/smoke-test.sh staging 8081
  environment:
    name: staging
    url: http://staging-environment
  only:
    - main
  when: manual
  needs: ["deploy:dev"]

# Deploy to Production
deploy:production:
  stage: deploy-production
  image: alpine:latest
  tags:
    - docker
    - production
  before_script:
    - apk add --no-cache docker-cli curl bash
    - docker info
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - echo "Deploying to Production environment..."
    - chmod +x scripts/deploy.sh
    - ./scripts/deploy.sh production $CI_COMMIT_SHORT_SHA
    - sleep 10
    - chmod +x scripts/smoke-test.sh
    - ./scripts/smoke-test.sh production 8082
  environment:
    name: production
    url: http://production-environment
  only:
    - main
  when: manual
  needs: ["deploy:staging"]
